<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Knowledge Base</title>
    <link href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%20width%3D%22128%22%20height%3D%22128%22%3E%0A%20%20%3C%21--%20Cube%20-%20top%20face%20--%3E%0A%20%20%3Cpolygon%20points%3D%2264%2C20%20108%2C42%2064%2C64%2020%2C42%22%20fill%3D%22%23636e72%22%2F%3E%0A%20%20%3C%21--%20Cube%20-%20right%20face%20--%3E%0A%20%20%3Cpolygon%20points%3D%2264%2C64%20108%2C42%20108%2C98%2064%2C120%22%20fill%3D%22%233d4447%22%2F%3E%0A%20%20%3C%21--%20Cube%20-%20left%20face%20--%3E%0A%20%20%3Cpolygon%20points%3D%2264%2C64%2020%2C42%2020%2C98%2064%2C120%22%20fill%3D%22%232d3436%22%2F%3E%0A%20%20%3C%21--%20Brain%20outline%20-%20large%20--%3E%0A%20%20%3Cpath%20d%3D%22M34%2C55%20C26%2C59%2022%2C68%2024%2C77%20C25%2C84%2030%2C89%2036%2C91%20C36%2C96%2039%2C102%2046%2C105%20C52%2C108%2059%2C107%2064%2C103%20C69%2C107%2076%2C108%2082%2C105%20C89%2C102%2092%2C96%2092%2C91%20C98%2C89%20103%2C84%20104%2C77%20C106%2C68%20102%2C59%2094%2C55%20C89%2C52%2082%2C52%2076%2C54%20C72%2C51%2068%2C50%2064%2C50%20C60%2C50%2056%2C51%2052%2C54%20C46%2C52%2039%2C52%2034%2C55%20Z%22%20fill%3D%22none%22%20stroke%3D%22%23a0aec0%22%20stroke-width%3D%224%22%2F%3E%0A%20%20%3C%21--%20Brain%20folds%20--%3E%0A%20%20%3Cpath%20d%3D%22M38%2C70%20C46%2C66%2054%2C67%2064%2C72%20C74%2C67%2082%2C66%2090%2C70%22%20fill%3D%22none%22%20stroke%3D%22%234a5568%22%20stroke-width%3D%223%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M40%2C82%20C48%2C78%2056%2C79%2064%2C84%20C72%2C79%2080%2C78%2088%2C82%22%20fill%3D%22none%22%20stroke%3D%22%23a0aec0%22%20stroke-width%3D%223%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M44%2C93%20C52%2C89%2058%2C90%2064%2C94%20C70%2C90%2076%2C89%2084%2C93%22%20fill%3D%22none%22%20stroke%3D%22%234a5568%22%20stroke-width%3D%222.5%22%2F%3E%0A%20%20%3C%21--%20Brain%20center%20line%20--%3E%0A%20%20%3Cpath%20d%3D%22M64%2C52%20C64%2C62%2064%2C75%2064%2C101%22%20fill%3D%22none%22%20stroke%3D%22%23a0aec0%22%20stroke-width%3D%222.5%22%2F%3E%0A%3C%2Fsvg%3E" rel="icon" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            height: 100%;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            color: #1a202c;
            flex: 1;
        }

        .icon-btn {
            background: none;
            border: 1px solid #e2e8f0;
            color: #4a5568;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            width: auto;
            font-weight: 500;
        }

        .icon-btn:hover {
            background: #f7fafc;
        }

        .subtitle {
            color: #718096;
            margin: 6px 0 16px;
            font-size: 13px;
        }

        details.settings {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 16px;
            flex: none;
        }

        details.settings > summary {
            cursor: pointer;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 500;
            color: #2d3748;
        }

        .settings-body {
            padding: 0 14px 14px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .settings-body .wide {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #2d3748;
            font-size: 13px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 4px 4px 16px;
        }

        .empty {
            margin: auto;
            color: #a0aec0;
            font-size: 14px;
            text-align: center;
        }

        .msg {
            max-width: 85%;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
            padding: 12px 16px;
            border-radius: 12px;
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg.assistant {
            align-self: flex-start;
            background: #f7fafc;
            border-left: 4px solid #667eea;
            color: #1a202c;
            border-bottom-left-radius: 4px;
        }

        .msg.error {
            align-self: flex-start;
            background: #fff5f5;
            border-left: 4px solid #fc8181;
            color: #c53030;
        }

        .msg .pending {
            color: #718096;
        }

        details.sources {
            margin-top: 10px;
            font-size: 13px;
            white-space: normal;
        }

        details.sources > summary {
            cursor: pointer;
            color: #4a5568;
            font-weight: 500;
        }

        .source-item {
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            border-left: 3px solid #cbd5e0;
        }

        .source-meta {
            font-size: 12px;
            color: #718096;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .source-dl {
            color: #4a5568;
            white-space: nowrap;
        }

        .source-text {
            font-size: 13px;
            color: #2d3748;
            line-height: 1.5;
        }

        form.composer {
            display: flex;
            gap: 10px;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }

        form.composer input[type="text"] {
            flex: 1;
        }

        form.composer button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        form.composer button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        form.composer button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            vertical-align: -2px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="32" height="32" class="logo">
  <!-- Cube - top face -->
  <polygon points="64,20 108,42 64,64 20,42" fill="#636e72"/>
  <!-- Cube - right face -->
  <polygon points="64,64 108,42 108,98 64,120" fill="#3d4447"/>
  <!-- Cube - left face -->
  <polygon points="64,64 20,42 20,98 64,120" fill="#2d3436"/>
  <!-- Brain outline - large -->
  <path d="M34,55 C26,59 22,68 24,77 C25,84 30,89 36,91 C36,96 39,102 46,105 C52,108 59,107 64,103 C69,107 76,108 82,105 C89,102 92,96 92,91 C98,89 103,84 104,77 C106,68 102,59 94,55 C89,52 82,52 76,54 C72,51 68,50 64,50 C60,50 56,51 52,54 C46,52 39,52 34,55 Z" fill="none" stroke="#a0aec0" stroke-width="4"/>
  <!-- Brain folds -->
  <path d="M38,70 C46,66 54,67 64,72 C74,67 82,66 90,70" fill="none" stroke="#4a5568" stroke-width="3"/>
  <path d="M40,82 C48,78 56,79 64,84 C72,79 80,78 88,82" fill="none" stroke="#a0aec0" stroke-width="3"/>
  <path d="M44,93 C52,89 58,90 64,94 C70,90 76,89 84,93" fill="none" stroke="#4a5568" stroke-width="2.5"/>
  <!-- Brain center line -->
  <path d="M64,52 C64,62 64,75 64,101" fill="none" stroke="#a0aec0" stroke-width="2.5"/>
</svg>Knowledge Base</h1>
        <button class="icon-btn" id="clearBtn" type="button">New chat</button>
    </header>
    <p class="subtitle">Ask your documents in plain language</p>

    <details class="settings">
        <summary>Settings</summary>
        <div class="settings-body">
            <div>
                <label for="limit">Number of sources (1-30)</label>
                <input id="limit" max="30" min="1" name="limit" type="number" value="5">
            </div>
            <div>
                <label for="temperature">Temperature</label>
                <input id="temperature" min="0.0" name="temperature" step="0.1" type="number" value="{{ temperature }}">
            </div>
            <div>
                <label for="maxtokens">Max answer length</label>
                <input id="maxtokens" max="1000000" min="1000" name="maxtokens" type="number" value="{{ max_tokens }}">
            </div>
            <div>
                <label for="historyTurns">Memory (turn pairs)</label>
                <input id="historyTurns" max="20" min="0" name="historyTurns" type="number" value="5">
            </div>
            <div class="wide">
                <label for="systemPrompt">System prompt ({context}, {history}, {question})</label>
                <textarea id="systemPrompt" name="systemPrompt">{{ system_prompt }}</textarea>
            </div>
        </div>
    </details>

    <div id="chat">
        <div class="empty" id="empty">Ask your first question</div>
    </div>

    <form class="composer" id="searchForm">
        <input autofocus id="question" name="question" placeholder="What do you want to know?" required type="text">
        <button id="submitBtn" type="submit">Ask</button>
    </form>
</div>

<script>
    const form = document.getElementById('searchForm');
    const submitBtn = document.getElementById('submitBtn');
    const questionInput = document.getElementById('question');
    const chatDiv = document.getElementById('chat');
    const emptyDiv = document.getElementById('empty');
    const clearBtn = document.getElementById('clearBtn');

    const history = [];
    const FILES_BASE = `${location.protocol}//${location.hostname}:{{ file_port | default(8081) }}`;
    const KEY_SEP = '⁄';

    clearBtn.addEventListener('click', () => {
        history.length = 0;
        chatDiv.innerHTML = '';
        chatDiv.appendChild(emptyDiv);
        questionInput.focus();
    });

    function addMessage(role, text) {
        emptyDiv.remove();
        const el = document.createElement('div');
        el.className = `msg ${role}`;
        el.textContent = text;
        chatDiv.appendChild(el);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        return el;
    }

    function renderSources(el, refs) {
        if (!refs || refs.length === 0) return;

        const details = document.createElement('details');
        details.className = 'sources';
        const summary = document.createElement('summary');
        summary.textContent = `Sources (${refs.length})`;
        details.appendChild(summary);

        refs.forEach((ref) => {
            const item = document.createElement('div');
            item.className = 'source-item';
            const score = ref.score ? ` | Relevance: ${(ref.score * 100).toFixed(1)}%` : '';
            const uri = ref.location?.s3Location?.uri || '';
            const path = uri.replace(/^[a-z0-9]+:\/\//i, '').split(KEY_SEP).join('/');
            const href = FILES_BASE + '/' + path.split('/').map(encodeURIComponent).join('/');
            const label = path
                ? `<a class="source-dl" href="${href}" download>${escapeHtml(path)}</a>`
                : '<strong>document</strong>';
            item.innerHTML = `
                <div class="source-meta">${label}${score}</div>
                <div class="source-text">${escapeHtml(ref.content?.text || '')}</div>
            `;
            details.appendChild(item);
        });

        el.appendChild(details);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function recentHistory() {
        const turns = parseInt(document.getElementById('historyTurns').value) || 0;
        if (turns === 0) return [];
        return history.slice(-turns * 2);
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const question = questionInput.value.trim();
        if (!question) return;

        const limit = document.getElementById('limit').value;
        const temperature = document.getElementById('temperature').value;
        const systemPrompt = document.getElementById('systemPrompt').value;
        const maxtokens = document.getElementById('maxtokens').value;

        addMessage('user', question);
        questionInput.value = '';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading"></span>';

        const answerEl = addMessage('assistant', '');
        const pending = document.createElement('span');
        pending.className = 'pending';
        pending.textContent = 'Thinking...';
        answerEl.appendChild(pending);

        try {
            const retrieveResp = await fetch('/knowledgebases/{{ kb_id }}/retrieve', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    retrievalQuery: {text: question},
                    retrievalConfiguration: {
                        vectorSearchConfiguration: {numberOfResults: parseInt(limit)}
                    }
                })
            });

            if (!retrieveResp.ok) {
                throw new Error(`HTTP ${retrieveResp.status}: ${retrieveResp.statusText}`);
            }

            const results = (await retrieveResp.json()).retrievalResults || [];
            const context = results.map((r) => r.content?.text || '').join('\n\n');

            const recent = recentHistory();
            const transcript = recent
                .map((m) => `${m.role === 'user' ? 'User' : 'Assistant'}: ${m.text}`)
                .join('\n');

            const system = systemPrompt
                .replace('{context}', context)
                .replace('{history}', transcript)
                .replace('{question}', question);

            const messages = systemPrompt.includes('{history}')
                ? []
                : recent.map((m) => ({role: m.role, content: [{text: m.text}]}));
            if (!systemPrompt.includes('{question}')) {
                messages.push({role: 'user', content: [{text: question}]});
            }
            if (messages.length === 0) {
                messages.push({role: 'user', content: [{text: question}]});
            }

            const converseResp = await fetch(`/model/${encodeURIComponent('{{ model_id }}')}/converse`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    system: [{text: system}],
                    messages: messages,
                    inferenceConfig: {
                        temperature: parseFloat(temperature),
                        maxTokens: parseInt(maxtokens)
                    }
                })
            });

            if (!converseResp.ok) {
                throw new Error(`HTTP ${converseResp.status}: ${converseResp.statusText}`);
            }

            const data = await converseResp.json();
            const answer = data.output?.message?.content?.[0]?.text || 'No answer generated';

            answerEl.textContent = answer;
            renderSources(answerEl, results);

            history.push({role: 'user', text: question});
            history.push({role: 'assistant', text: answer});

        } catch (error) {
            answerEl.remove();
            addMessage('error', `Error: ${error.message}`);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Ask';
            questionInput.focus();
        }
    });

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
